version: '3.8'

services:
  db:
    image: postgres:15
    container_name: app_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password1234
      POSTGRES_DB: portalTrabajo
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: