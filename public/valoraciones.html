<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valoraciones de empresas · PortalTrabajo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<!-- MOD-02-REVIEWS · Todos los usuarios (leer) / Candidato registrado (valorar) -->
<body data-usuario="visitante" data-activo="valoraciones">
  <header id="navbar" class="container-xl pt-3"></header>

  <main class="container-xl py-4">
    <nav aria-label="Ruta">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">PortalTrabajo</a></li>
        <li class="breadcrumb-item active" aria-current="page">Valoraciones de empresas</li>
      </ol>
    </nav>
    <h1 class="titulo-pagina">Valoraciones de empresas</h1>
    <p class="text-secondary">Opiniones y calificaciones de empleados y exempleados para que decidas dónde trabajar.</p>

    <!-- Búsqueda y orden -->
    <section id="herramientas" class="neo-card p-3 mb-4 row g-2 align-items-end mx-0">
      <div class="col-md-6">
        <label class="form-label" for="v-buscar">Buscar empresa</label>
        <input id="v-buscar" type="search" class="form-control" placeholder="Nombre, sector o ciudad">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="v-orden">Ordenar por</label>
        <select id="v-orden" class="form-select">
          <option value="promedio">Mejor valoradas</option>
          <option value="opiniones">Más opiniones</option>
        </select>
      </div>
      <div class="col-md-3">
        <a class="btn btn-neo-primary w-100" href="perfil-usuario.html#valoraciones"><i class="bi bi-star me-1" aria-hidden="true"></i>Valorar una empresa</a>
      </div>
    </section>

    <div id="lista-empresas" class="d-grid gap-4"></div>
    <p id="sin-empresas" class="text-secondary" hidden>Ninguna empresa coincide con tu búsqueda.</p>
  </main>

  <footer id="pie"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/comun.js"></script>
  <script>
    const campoBuscar = document.getElementById('v-buscar');
    const campoOrden = document.getElementById('v-orden');
    const lista = document.getElementById('lista-empresas');

    function pintar() {
      const consulta = normalizar(campoBuscar.value);
      const empresas = EMPRESAS
        .filter(e => normalizar(`${e.nombre} ${e.sector} ${e.ubicacion}`).includes(consulta))
        .sort((a, b) => b[campoOrden.value] - a[campoOrden.value]);
      document.getElementById('sin-empresas').hidden = empresas.length > 0;
      lista.innerHTML = empresas.map(e => `
        <article id="${e.id}" class="neo-card p-4 empresa">
          <div class="row g-4">
            <div class="col-md-4">
              <h2 class="h5 mb-1"><i class="bi bi-building me-1" aria-hidden="true"></i>${esc(e.nombre)}</h2>
              <p class="small text-secondary mb-3">${esc(e.sector)} · ${esc(e.ubicacion)}</p>
              <div class="neo-subbox p-3 mb-3 text-center">
                <span class="metrica">${e.promedio.toFixed(1)}</span>
                <span class="d-block" style="color:var(--color-warning);" aria-label="${e.promedio} de 5 estrellas">${estrellas(e.promedio)}</span>
                <span class="small text-secondary">${e.opiniones} opiniones</span>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-neo-primary btn-sm" href="perfil-usuario.html?empresa=${encodeURIComponent(e.nombre)}#valoraciones">Valorar</a>
                <a class="btn btn-neo-secondary btn-sm" href="resultados.html?q=${encodeURIComponent(e.nombre)}">Ver ofertas</a>
              </div>
            </div>
            <div class="col-md-8">
              <h3 class="h6">Opiniones recientes</h3>
              <ul class="list-unstyled d-grid gap-2 mb-0">
                ${e.resenas.map(r => `
                  <li class="neo-subbox p-3">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-1">
                      <span class="fw-bold small">${esc(r.autor)} <span class="ms-2" style="color:var(--color-warning);" aria-label="${r.calificacion} de 5">${estrellas(r.calificacion)}</span></span>
                      <button type="button" class="btn btn-neo-secondary btn-sm py-0" data-reportar><i class="bi bi-flag me-1" aria-hidden="true"></i>Reportar</button>
                    </div>
                    <p class="small text-secondary mb-0">“${esc(r.texto)}”</p>
                  </li>`).join('')}
              </ul>
            </div>
          </div>
        </article>`).join('');
    }

    // Reportar envía la reseña a la bandeja de moderación del administrador.
    // shortcut: solo cambia el botón; con la API, hacer POST del reporte
    lista.addEventListener('click', evento => {
      const boton = evento.target.closest('[data-reportar]');
      if (!boton) return;
      boton.disabled = true;
      boton.innerHTML = '<i class="bi bi-flag-fill me-1" aria-hidden="true"></i>Reportada para moderación';
      notificar('Gracias. El equipo de moderación revisará la reseña.', 'info');
    });

    [campoBuscar, campoOrden].forEach(control => control.addEventListener('input', pintar));
    pintar();
    document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView(); // la tarjeta se pinta después de cargar
  </script>
</body>
</html>
